name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: TypeScript
        run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Isolated build and browser regression
        run: npm run test:e2e:audit
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-audit-report
          path: |
            playwright-report/
            test-results/
            docs/evidencias/2026-09-06/
          retention-days: 7
